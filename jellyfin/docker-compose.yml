services:
  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 0:0
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    volumes:
      - ./config:/config:Z
      - ./cache:/cache:Z
      - ./media:/media:ro,Z
    restart: unless-stopped
    networks:
      - demo-net
    labels:
      - "io.containers.autoupdate=registry"

networks:
  demo-net:
    name: demo-net
    external: true
